name: Install verified portfolio ZIP (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-haniyamjad-portfolio
  cancel-in-progress: false

jobs:
  install:
    if: github.repository == 'haniyaamjad1124-wq/haniyaamjad1124-wq.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Verify and extract the exact prepared static site
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, stat, zipfile
          root = pathlib.Path.cwd().resolve()
          archive = root / 'haniyamjad-github-pages-clean-entry.zip'
          expected = '921075b45bc7ab6c43594b44f83e15073eb08edc418500e022488ea83289d9ba'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, 'Unexpected ZIP checksum'
          with zipfile.ZipFile(archive) as z:
              files = [i for i in z.infolist() if not i.is_dir()]
              assert len(files) == 61, 'Unexpected deployment file count'
              assert len({i.filename for i in files}) == 61, 'Duplicate paths in ZIP'
              for info in files:
                  p = pathlib.PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert '.git' not in p.parts and '.github' not in p.parts
                  assert not stat.S_ISLNK(info.external_attr >> 16)
                  target = root.joinpath(*p.parts)
                  assert target.resolve().is_relative_to(root)
              for info in files:
                  target = root.joinpath(*pathlib.PurePosixPath(info.filename).parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))
              paths = [i.filename for i in files]
          assert (root / 'CNAME').read_text().strip() == 'haniyamjad.com'
          archive.unlink()
          paths.append(archive.name)
          (root / '.git' / 'portfolio-deployment-paths.json').write_text(json.dumps(paths))
          print('Verified and installed 61 static deployment files; domain configuration retained.')
          PY
      - name: Commit only the deployment files without rewriting history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import json, pathlib, subprocess
          paths = json.loads(pathlib.Path('.git/portfolio-deployment-paths.json').read_text())
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          git diff --cached --check
          git commit -m 'Deploy verified text-free bookshelf portfolio'
          git push origin HEAD:main
